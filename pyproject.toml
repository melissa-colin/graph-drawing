# Carte d'identité du projet : nom + bibliothèques nécessaires.
# `uv sync` lit ce fichier et installe tout ; uv.lock fige les versions pour qu'on ait tous les mêmes.
[project]
name = "graphdraw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "networkx",
    "matplotlib",
]

[dependency-groups]
dev = [
    "jupyter",
    "codecarbon",
]

# Permet `import graphdraw` depuis les notebooks.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphdraw"]

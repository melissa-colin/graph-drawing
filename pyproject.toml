[project]
name = "graphdraw"
version = "0.1.0"
description = "Graph drawing différentiable en espace écran (SDF + descente de gradient)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "networkx",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "codecarbon",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphdraw"]

[tool.ruff]
line-length = 100
